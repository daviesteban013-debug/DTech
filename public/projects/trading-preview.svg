<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="tr-glow" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#C81E3A" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#14100F" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0A0808" stop-opacity="1" />
    </radialGradient>

    <!-- Chart Grid -->
    <pattern id="tr-grid" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 40" fill="none" stroke="#221817" stroke-width="1" stroke-opacity="0.45" />
    </pattern>

    <linearGradient id="tr-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C81E3A" />
      <stop offset="50%" stop-color="#FF3B47" />
      <stop offset="100%" stop-color="#C81E3A" />
    </linearGradient>

    <linearGradient id="ob-zone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C81E3A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF3B47" stop-opacity="0.08" />
    </linearGradient>

    <filter id="tr-glow-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1280" height="720" fill="#0A0808" />
  <rect width="1280" height="720" fill="url(#tr-glow)" />
  <rect width="1280" height="720" fill="url(#tr-grid)" />

  <!-- Outer frame with rim light -->
  <rect x="24" y="24" width="1232" height="672" rx="4" fill="none" stroke="#2D2220" stroke-width="1.5" />
  <rect x="956" y="24" width="300" height="1.5" fill="url(#tr-red)" />
  <rect x="1254" y="24" width="1.5" height="200" fill="url(#tr-red)" />

  <!-- Window Header / MT5 Terminal Bar -->
  <rect x="24" y="24" width="1232" height="54" fill="#14100F" fill-opacity="0.9" />
  <line x1="24" y1="78" x2="1256" y2="78" stroke="#251C1B" stroke-width="1" />

  <!-- Terminal Title -->
  <circle cx="56" cy="51" r="5" fill="#FF3B47" />
  <text x="74" y="56" fill="#F2EDE9" font-family="monospace" font-size="13" font-weight="bold">KZ·OB ALGO v10.7</text>
  <text x="230" y="56" fill="#9C9490" font-family="monospace" font-size="12">JPN225 [Nikkei] • M5 • Pepperstone MT5 Live</text>

  <!-- Status badges right -->
  <rect x="1060" y="38" width="170" height="26" rx="2" fill="#C81E3A" fill-opacity="0.2" stroke="#FF3B47" stroke-width="1" />
  <text x="1145" y="55" fill="#FF3B47" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">EA RUNNING // DESATENDIDO</text>

  <!-- Main Chart Canvas -->
  <rect x="56" y="108" width="860" height="420" rx="2" fill="#0D0908" stroke="#251C1B" stroke-width="1" />

  <!-- Price Scale on Right of Chart -->
  <rect x="836" y="108" width="80" height="420" fill="#14100F" stroke-left="#251C1B" stroke-width="1" />
  <text x="846" y="140" fill="#9C9490" font-family="monospace" font-size="10">38,620.0</text>
  <text x="846" y="190" fill="#9C9490" font-family="monospace" font-size="10">38,540.0</text>
  <text x="846" y="240" fill="#FF3B47" font-family="monospace" font-size="10" font-weight="bold">38,480.0</text>
  <text x="846" y="290" fill="#9C9490" font-family="monospace" font-size="10">38,420.0</text>
  <text x="846" y="340" fill="#9C9490" font-family="monospace" font-size="10">38,360.0</text>
  <text x="846" y="390" fill="#00E676" font-family="monospace" font-size="10" font-weight="bold">38,300.0</text>
  <text x="846" y="440" fill="#9C9490" font-family="monospace" font-size="10">38,240.0</text>
  <text x="846" y="490" fill="#9C9490" font-family="monospace" font-size="10">38,180.0</text>

  <!-- Kill Zone Overlay Box -->
  <rect x="180" y="120" width="340" height="390" fill="#FF3B47" fill-opacity="0.04" stroke="#C81E3A" stroke-width="1" stroke-dasharray="4,4" />
  <rect x="190" y="130" width="170" height="20" rx="1" fill="#1C1413" stroke="#C81E3A" stroke-width="1" />
  <text x="275" y="144" fill="#FF3B47" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">TOKYO KILL ZONE (SMC)</text>

  <!-- Bullish Order Block (OB Zone) -->
  <rect x="340" y="370" width="460" height="42" fill="url(#ob-zone)" stroke="#C81E3A" stroke-width="1" />
  <text x="350" y="386" fill="#FF3B47" font-family="monospace" font-size="10" font-weight="bold">H1/M15 ORDER BLOCK [MITIGATED]</text>
  <text x="350" y="402" fill="#F2EDE9" font-family="monospace" font-size="9">Institutional Volume: 14.8k lots • Score: 94.2%</text>

  <!-- Candlesticks Sequence -->
  <g transform="translate(80, 108)">
    <!-- Candle 1 Bearish -->
    <line x1="40" y1="180" x2="40" y2="270" stroke="#C81E3A" stroke-width="1.5" />
    <rect x="34" y="200" width="12" height="50" fill="#C81E3A" />

    <!-- Candle 2 Bearish -->
    <line x1="80" y1="230" x2="80" y2="330" stroke="#C81E3A" stroke-width="1.5" />
    <rect x="74" y="245" width="12" height="65" fill="#C81E3A" />

    <!-- Candle 3 Bearish (Sweep into KZ) -->
    <line x1="120" y1="290" x2="120" y2="400" stroke="#C81E3A" stroke-width="1.5" />
    <rect x="114" y="305" width="12" height="75" fill="#C81E3A" />

    <!-- Candle 4 Inverted Hammer (Liquidity Grab) -->
    <line x1="160" y1="340" x2="160" y2="415" stroke="#F2EDE9" stroke-width="1.5" />
    <rect x="154" y="350" width="12" height="25" fill="#F2EDE9" />

    <!-- Candle 5 Bullish Reaction -->
    <line x1="200" y1="310" x2="200" y2="380" stroke="#F2EDE9" stroke-width="1.5" />
    <rect x="194" y="325" width="12" height="40" fill="#F2EDE9" />

    <!-- Candle 6 Bullish Expansion -->
    <line x1="240" y1="260" x2="240" y2="340" stroke="#F2EDE9" stroke-width="1.5" />
    <rect x="234" y="275" width="12" height="55" fill="#F2EDE9" />

    <!-- Candle 7 Retest of OB -->
    <line x1="280" y1="290" x2="280" y2="385" stroke="#C81E3A" stroke-width="1.5" />
    <rect x="274" y="310" width="12" height="45" fill="#C81E3A" />

    <!-- CHoCH Breakout Line -->
    <line x1="190" y1="260" x2="620" y2="260" stroke="#FF3B47" stroke-width="1.5" stroke-dasharray="6,4" />
    <rect x="360" y="246" width="170" height="18" fill="#1F1413" stroke="#FF3B47" stroke-width="1" />
    <text x="445" y="259" fill="#FF3B47" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">CHoCH CONFIRMED (BOS)</text>

    <!-- Candle 8 Huge Bullish Candle -->
    <line x1="360" y1="210" x2="360" y2="320" stroke="#00E676" stroke-width="1.5" />
    <rect x="354" y="225" width="12" height="85" fill="#00E676" />

    <!-- Candle 9 Continued Expansion -->
    <line x1="400" y1="160" x2="400" y2="250" stroke="#00E676" stroke-width="1.5" />
    <rect x="394" y="175" width="12" height="60" fill="#00E676" />

    <!-- Candle 10 Target Reached -->
    <line x1="440" y1="120" x2="440" y2="190" stroke="#00E676" stroke-width="1.5" />
    <rect x="434" y="130" width="12" height="50" fill="#00E676" />

    <!-- Take Profit Marker -->
    <circle cx="440" cy="130" r="5" fill="#00E676" filter="url(#tr-glow-f)" />
    <rect x="460" y="120" width="130" height="22" rx="2" fill="#0C1B14" stroke="#00E676" stroke-width="1" />
    <text x="525" y="135" fill="#00E676" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">TP HIT // +3.82R</text>
  </g>

  <!-- Right Panel: Quantitative Execution Engine -->
  <rect x="940" y="108" width="284" height="420" rx="2" fill="#120E0D" stroke="#251C1B" stroke-width="1" />

  <!-- Engine Header -->
  <rect x="940" y="108" width="284" height="48" fill="#181312" />
  <line x1="940" y1="156" x2="1224" y2="156" stroke="#251C1B" stroke-width="1" />
  <text x="956" y="138" fill="#F2EDE9" font-family="sans-serif" font-size="14" font-weight="bold">MQL5 Confluence Engine</text>

  <!-- Confluence Factors -->
  <g transform="translate(956, 176)">
    <!-- Item 1 -->
    <text x="0" y="12" fill="#9C9490" font-family="monospace" font-size="10">ORDER BLOCK INTEGRITY</text>
    <rect x="0" y="20" width="252" height="8" rx="2" fill="#1F1514" />
    <rect x="0" y="20" width="235" height="8" rx="2" fill="#C81E3A" />
    <text x="252" y="14" fill="#FF3B47" font-family="monospace" font-size="10" text-anchor="end">93%</text>

    <!-- Item 2 -->
    <text x="0" y="52" fill="#9C9490" font-family="monospace" font-size="10">FVG (FAIR VALUE GAP) FILL</text>
    <rect x="0" y="60" width="252" height="8" rx="2" fill="#1F1514" />
    <rect x="0" y="60" width="215" height="8" rx="2" fill="#C81E3A" />
    <text x="252" y="54" fill="#FF3B47" font-family="monospace" font-size="10" text-anchor="end">86%</text>

    <!-- Item 3 -->
    <text x="0" y="92" fill="#9C9490" font-family="monospace" font-size="10">SESSION KILL ZONE ALIGN</text>
    <rect x="0" y="100" width="252" height="8" rx="2" fill="#1F1514" />
    <rect x="0" y="100" width="252" height="8" rx="2" fill="#00E676" />
    <text x="252" y="94" fill="#00E676" font-family="monospace" font-size="10" text-anchor="end">100%</text>

    <!-- Stats Summary Card -->
    <rect x="0" y="130" width="252" height="140" rx="2" fill="#0A0808" stroke="#251C1B" stroke-width="1" />
    <text x="12" y="152" fill="#9C9490" font-family="monospace" font-size="10">RISK PARAMETERS</text>
    
    <text x="12" y="176" fill="#F2EDE9" font-family="sans-serif" font-size="11">Riesgo por trade:</text>
    <text x="240" y="176" fill="#FF3B47" font-family="monospace" font-size="11" text-anchor="end" font-weight="bold">0.50% Equity</text>

    <text x="12" y="200" fill="#F2EDE9" font-family="sans-serif" font-size="11">Filtrado no-repaint:</text>
    <text x="240" y="200" fill="#00E676" font-family="monospace" font-size="11" text-anchor="end" font-weight="bold">Activo (Closed bar)</text>

    <text x="12" y="224" fill="#F2EDE9" font-family="sans-serif" font-size="11">Timeframe óptimo:</text>
    <text x="240" y="224" fill="#F2EDE9" font-family="monospace" font-size="11" text-anchor="end">5 minutos</text>

    <text x="12" y="248" fill="#F2EDE9" font-family="sans-serif" font-size="11">Broker FIX API:</text>
    <text x="240" y="248" fill="#F2EDE9" font-family="monospace" font-size="11" text-anchor="end">Pepperstone MT5</text>
  </g>

  <!-- Bottom Architecture Ribbon -->
  <rect x="56" y="552" width="1168" height="116" rx="2" fill="#14100F" stroke="#251C1B" stroke-width="1" />
  
  <g transform="translate(80, 574)">
    <text x="0" y="16" fill="#9C9490" font-family="monospace" font-size="11" font-weight="600">QUANTITATIVE ALGO HIGHLIGHTS</text>
    <text x="0" y="42" fill="#F2EDE9" font-family="sans-serif" font-size="14">
      Estrategia basada en Smart Money Concepts portada de Pine Script v5 a Expert Advisor MQL5 para ejecución institucional en JPN225.
    </text>
    
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="120" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="60" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">Pine Script v5</text>

      <rect x="132" y="0" width="100" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="182" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">MQL5 EA</text>

      <rect x="244" y="0" width="110" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="299" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">Pepperstone MT5</text>

      <rect x="366" y="0" width="150" height="22" rx="2" fill="#1E1716" stroke="#C81E3A" stroke-width="1" />
      <text x="441" y="15" fill="#FF3B47" font-family="monospace" font-size="10" text-anchor="middle">Smart Money Concepts</text>
    </g>
  </g>
</svg>
