<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="gm-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#C81E3A" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#120E0D" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#080606" stop-opacity="1" />
    </radialGradient>

    <!-- Isometric / Tactical Matrix Grid -->
    <pattern id="gm-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#261A18" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="24" cy="24" r="1.5" fill="#FF3B47" fill-opacity="0.25" />
    </pattern>

    <linearGradient id="gm-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C81E3A" />
      <stop offset="50%" stop-color="#FF3B47" />
      <stop offset="100%" stop-color="#C81E3A" />
    </linearGradient>

    <filter id="gm-glow-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glitch displacement line pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="1280" height="720" fill="#080606" />
  <rect width="1280" height="720" fill="url(#gm-glow)" />
  <rect width="1280" height="720" fill="url(#gm-grid)" />

  <!-- Outer frame with rim light -->
  <rect x="24" y="24" width="1232" height="672" rx="4" fill="none" stroke="#2D2220" stroke-width="1.5" />
  <rect x="24" y="694" width="350" height="2" fill="url(#gm-red)" />
  <rect x="24" y="494" width="2" height="202" fill="url(#gm-red)" />

  <!-- Window Header / Unity 6 Runtime Bar -->
  <rect x="24" y="24" width="1232" height="54" fill="#14100F" fill-opacity="0.9" />
  <line x1="24" y1="78" x2="1256" y2="78" stroke="#251C1B" stroke-width="1" />

  <!-- Title & Comp Badge -->
  <circle cx="56" cy="51" r="5" fill="#FF3B47" />
  <text x="74" y="56" fill="#F2EDE9" font-family="monospace" font-size="13" font-weight="bold">THREAT MATRIX // 2D TOWER DEFENSE</text>
  <text x="350" y="56" fill="#9C9490" font-family="monospace" font-size="12">Semana Talento TIC Los Patios 2026 • Unity 6 LTS</text>

  <!-- Status badges right -->
  <rect x="1030" y="38" width="200" height="26" rx="2" fill="#C81E3A" fill-opacity="0.2" stroke="#FF3B47" stroke-width="1" />
  <text x="1130" y="55" fill="#FF3B47" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">RENDER: 60.1 FPS [0 B GC]</text>

  <!-- Left/Center: Tactical Game Viewport -->
  <rect x="56" y="108" width="800" height="420" rx="2" fill="#0C0908" stroke="#251C1B" stroke-width="1" />

  <!-- Game Arena Elements -->
  <g transform="translate(56, 108)">
    <!-- Central Core Defense Hub -->
    <circle cx="400" cy="210" r="85" fill="none" stroke="#C81E3A" stroke-width="1.5" stroke-dasharray="8,6" />
    <circle cx="400" cy="210" r="45" fill="#1C1211" stroke="#FF3B47" stroke-width="2" />
    <circle cx="400" cy="210" r="18" fill="#FF3B47" filter="url(#gm-glow-f)" />
    <text x="400" y="275" fill="#F2EDE9" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">CORE NEXUS: 100%</text>

    <!-- Defensive Towers with Energy Beams -->
    <!-- Tower Alpha -->
    <rect x="220" y="100" width="36" height="36" rx="2" fill="#1C1413" stroke="#FF3B47" stroke-width="1.5" />
    <circle cx="238" cy="118" r="6" fill="#FF3B47" />
    <line x1="238" y1="118" x2="160" y2="240" stroke="#FF3B47" stroke-width="2" stroke-opacity="0.85" filter="url(#gm-glow-f)" />
    <text x="238" y="90" fill="#9C9490" font-family="monospace" font-size="9" text-anchor="middle">EMP TURRET</text>

    <!-- Tower Beta -->
    <rect x="540" y="110" width="36" height="36" rx="2" fill="#1C1413" stroke="#FF3B47" stroke-width="1.5" />
    <circle cx="558" cy="128" r="6" fill="#FF3B47" />
    <line x1="558" y1="128" x2="650" y2="220" stroke="#FF3B47" stroke-width="2" stroke-opacity="0.85" filter="url(#gm-glow-f)" />
    <text x="558" y="100" fill="#9C9490" font-family="monospace" font-size="9" text-anchor="middle">RAIL MATRIX</text>

    <!-- Tower Gamma -->
    <rect x="382" y="320" width="36" height="36" rx="2" fill="#1C1413" stroke="#00E676" stroke-width="1.5" />
    <circle cx="400" cy="338" r="6" fill="#00E676" />
    <line x1="400" y1="338" x2="300" y2="380" stroke="#00E676" stroke-width="1.5" stroke-opacity="0.75" />
    <text x="400" y="374" fill="#9C9490" font-family="monospace" font-size="9" text-anchor="middle">CRYO COIL</text>

    <!-- Enemy Wave Clusters (Corrupted Daemons) -->
    <!-- Enemy Cluster 1 -->
    <g transform="translate(130, 220)">
      <polygon points="20,10 32,32 8,32" fill="#FF3B47" />
      <polygon points="45,15 57,37 33,37" fill="#C81E3A" opacity="0.8" />
      <polygon points="10,35 22,57 -2,57" fill="#C81E3A" opacity="0.8" />
      <circle cx="30" cy="30" r="30" fill="none" stroke="#FF3B47" stroke-width="1" stroke-dasharray="3,3" />
      <text x="30" y="72" fill="#FF3B47" font-family="monospace" font-size="9" text-anchor="middle">SWARM ALPHA (FSM: FLANK)</text>
    </g>

    <!-- Enemy Cluster 2 -->
    <g transform="translate(630, 200)">
      <polygon points="20,10 32,32 8,32" fill="#FF3B47" />
      <polygon points="45,25 57,47 33,47" fill="#FF3B47" />
      <circle cx="30" cy="30" r="28" fill="none" stroke="#FF3B47" stroke-width="1" stroke-dasharray="3,3" />
      <text x="30" y="72" fill="#FF3B47" font-family="monospace" font-size="9" text-anchor="middle">HEAVY TANK (FSM: BREECH)</text>
    </g>

    <!-- Glitch Corruption overlay text -->
    <rect x="20" y="20" width="180" height="24" rx="1" fill="#161110" stroke="#C81E3A" stroke-width="1" />
    <text x="30" y="36" fill="#FF3B47" font-family="monospace" font-size="10" font-weight="bold">SYSTEM CORRUPTION: 42%</text>

    <!-- Wave Telemetry -->
    <rect x="620" y="20" width="160" height="24" rx="1" fill="#161110" stroke="#3D2D2B" stroke-width="1" />
    <text x="700" y="36" fill="#F2EDE9" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">WAVE 14 / 20 [INCOMING]</text>
  </g>

  <!-- Right Panel: Telemetry & Dynamic Price Simulation -->
  <rect x="880" y="108" width="344" height="420" rx="2" fill="#120E0D" stroke="#251C1B" stroke-width="1" />

  <!-- Telemetry Header -->
  <rect x="880" y="108" width="344" height="48" fill="#181312" />
  <line x1="880" y1="156" x2="1224" y2="156" stroke="#251C1B" stroke-width="1" />
  <text x="904" y="138" fill="#F2EDE9" font-family="sans-serif" font-size="14" font-weight="bold">Engine Systems Architecture</text>

  <!-- Architecture Cards -->
  <g transform="translate(904, 176)">
    <!-- Card 1: Object Pooling -->
    <rect x="0" y="0" width="296" height="66" rx="2" fill="#0A0808" stroke="#251C1B" stroke-width="1" />
    <text x="14" y="22" fill="#9C9490" font-family="monospace" font-size="10">OBJECT POOLING SYSTEM</text>
    <text x="14" y="44" fill="#F2EDE9" font-family="sans-serif" font-size="12" font-weight="bold">Zero GC allocation en combate</text>
    <text x="280" y="44" fill="#00E676" font-family="monospace" font-size="11" text-anchor="end">350 pooled</text>

    <!-- Card 2: FSM AI -->
    <rect x="0" y="78" width="296" height="66" rx="2" fill="#0A0808" stroke="#251C1B" stroke-width="1" />
    <text x="14" y="100" fill="#9C9490" font-family="monospace" font-size="10">ENEMY FINITE STATE MACHINE</text>
    <text x="14" y="122" fill="#F2EDE9" font-family="sans-serif" font-size="12" font-weight="bold">Comportamiento adaptativo</text>
    <text x="280" y="122" fill="#FF3B47" font-family="monospace" font-size="11" text-anchor="end">4 sub-estados</text>

    <!-- Card 3: Dynamic Price Model -->
    <rect x="0" y="156" width="296" height="74" rx="2" fill="#0A0808" stroke="#251C1B" stroke-width="1" />
    <text x="14" y="178" fill="#9C9490" font-family="monospace" font-size="10">DYNAMIC ECONOMY ENGINE</text>
    <text x="14" y="200" fill="#FF3B47" font-family="monospace" font-size="12" font-weight="bold">Coste de torre: +18.4% (Oferta/Demanda)</text>
    <text x="14" y="218" fill="#9C9490" font-family="sans-serif" font-size="10">Precio escala con número de unidades desplegadas</text>

    <!-- Telemetry bottom bar -->
    <g transform="translate(0, 244)">
      <rect x="0" y="0" width="88" height="54" rx="2" fill="#161110" stroke="#C81E3A" stroke-width="1" stroke-opacity="0.4" />
      <text x="44" y="22" fill="#9C9490" font-family="sans-serif" font-size="9" text-anchor="middle">MOTOR</text>
      <text x="44" y="44" fill="#F2EDE9" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Unity 6</text>

      <rect x="104" y="0" width="88" height="54" rx="2" fill="#161110" stroke="#C81E3A" stroke-width="1" stroke-opacity="0.4" />
      <text x="148" y="22" fill="#9C9490" font-family="sans-serif" font-size="9" text-anchor="middle">FPS RATE</text>
      <text x="148" y="44" fill="#00E676" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">60 FPS</text>

      <rect x="208" y="0" width="88" height="54" rx="2" fill="#161110" stroke="#C81E3A" stroke-width="1" stroke-opacity="0.4" />
      <text x="252" y="22" fill="#9C9490" font-family="sans-serif" font-size="9" text-anchor="middle">AI ASSETS</text>
      <text x="252" y="44" fill="#FF3B47" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Flow Gen</text>
    </g>
  </g>

  <!-- Bottom Architecture Ribbon -->
  <rect x="56" y="552" width="1168" height="116" rx="2" fill="#14100F" stroke="#251C1B" stroke-width="1" />
  
  <g transform="translate(80, 574)">
    <text x="0" y="16" fill="#9C9490" font-family="monospace" font-size="11" font-weight="600">GAMEPLAY &amp; ARCHITECTURE HIGHLIGHTS</text>
    <text x="0" y="42" fill="#F2EDE9" font-family="sans-serif" font-size="14">
      Tower defense 2D en Unity 6 con estética cyberpunk glitch, algoritmos de economía dinámica de precios y pooling de alto rendimiento.
    </text>
    
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="90" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="45" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">Unity 6</text>

      <rect x="102" y="0" width="60" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="132" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">C#</text>

      <rect x="174" y="0" width="170" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="259" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">Object Pooling Architecture</text>

      <rect x="356" y="0" width="160" height="22" rx="2" fill="#1E1716" stroke="#C81E3A" stroke-width="1" />
      <text x="436" y="15" fill="#FF3B47" font-family="monospace" font-size="10" text-anchor="middle">Google Flow (AI Art)</text>
    </g>
  </g>
</svg>
