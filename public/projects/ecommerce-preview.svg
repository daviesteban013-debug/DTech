<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#C81E3A" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#14100F" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0A0808" stop-opacity="1" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#221817" stroke-width="1" stroke-opacity="0.4" />
    </pattern>

    <!-- Linear Accents -->
    <linearGradient id="red-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C81E3A" />
      <stop offset="50%" stop-color="#FF3B47" />
      <stop offset="100%" stop-color="#C81E3A" />
    </linearGradient>

    <linearGradient id="waveform-grad-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B47" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C81E3A" stop-opacity="0.05" />
    </radialGradient>

    <linearGradient id="waveform-grad-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2EDE9" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#9C9490" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1280" height="720" fill="#0A0808" />
  <rect width="1280" height="720" fill="url(#bg-glow)" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Outer frame with rim light -->
  <rect x="24" y="24" width="1232" height="672" rx="4" fill="none" stroke="#2D2220" stroke-width="1.5" />
  <rect x="24" y="24" width="300" height="1.5" fill="url(#red-gradient)" />
  <rect x="24" y="24" width="1.5" height="200" fill="url(#red-gradient)" />

  <!-- Window Header / Browser Bar -->
  <rect x="24" y="24" width="1232" height="54" fill="#14100F" fill-opacity="0.9" />
  <line x1="24" y1="78" x2="1256" y2="78" stroke="#251C1B" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="56" cy="51" r="5" fill="#C81E3A" />
  <circle cx="76" cy="51" r="5" fill="#3D2D2B" />
  <circle cx="96" cy="51" r="5" fill="#2E2220" />

  <!-- URL bar simulation -->
  <rect x="140" y="40" width="520" height="24" rx="2" fill="#0A0808" stroke="#281F1D" stroke-width="1" />
  <text x="156" y="56" fill="#9C9490" font-family="monospace" font-size="11">https://store.binaural-vault.internal/checkout/session_live_9482</text>
  <rect x="635" y="47" width="12" height="10" rx="1" fill="#C81E3A" opacity="0.8" />

  <!-- Status badges right -->
  <text x="1220" y="56" fill="#F2EDE9" font-family="monospace" font-size="11" text-anchor="end" font-weight="600">AUDIO ENGINE // 96kHz 24-bit</text>

  <!-- Left Panel: Binaural Player and Waveform Visualizer -->
  <rect x="56" y="108" width="760" height="420" rx="2" fill="#120E0D" stroke="#251C1B" stroke-width="1" />
  
  <!-- Player Header -->
  <rect x="56" y="108" width="760" height="48" fill="#181312" />
  <line x1="56" y1="156" x2="816" y2="156" stroke="#251C1B" stroke-width="1" />
  <text x="80" y="138" fill="#F2EDE9" font-family="sans-serif" font-size="14" font-weight="bold">Spatial Audio Streamer — Binaural 360°</text>
  <rect x="670" y="122" width="120" height="22" rx="2" fill="#C81E3A" fill-opacity="0.15" stroke="#C81E3A" stroke-width="1" />
  <text x="730" y="137" fill="#FF3B47" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">LOSSLESS WAV</text>

  <!-- Waveform Canvas -->
  <g transform="translate(80, 200)">
    <!-- Grid inside canvas -->
    <line x1="0" y1="80" x2="712" y2="80" stroke="#C81E3A" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4" />
    <line x1="0" y1="180" x2="712" y2="180" stroke="#3D2D2B" stroke-width="1" stroke-opacity="0.4" />
    <line x1="0" y1="280" x2="712" y2="280" stroke="#C81E3A" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4" />

    <!-- Left Channel Waveform Bars -->
    <path d="M 0 180 
             Q 30 60, 60 140 T 120 70 T 180 180 T 240 50 T 300 230 T 360 80 T 420 160 T 480 40 T 540 220 T 600 110 T 660 180 T 712 170 
             L 712 180 L 0 180 Z" fill="url(#waveform-grad-left)" />
    <path d="M 0 180 
             Q 30 60, 60 140 T 120 70 T 180 180 T 240 50 T 300 230 T 360 80 T 420 160 T 480 40 T 540 220 T 600 110 T 660 180 T 712 170" 
          fill="none" stroke="#FF3B47" stroke-width="2.5" filter="url(#glow)" />

    <!-- Right Channel Waveform Mirror -->
    <path d="M 0 180 
             Q 35 240, 70 190 T 140 290 T 210 180 T 280 310 T 350 150 T 420 270 T 490 200 T 560 300 T 630 190 T 712 180 
             L 712 180 L 0 180 Z" fill="url(#waveform-grad-right)" />
    <path d="M 0 180 
             Q 35 240, 70 190 T 140 290 T 210 180 T 280 310 T 350 150 T 420 270 T 490 200 T 560 300 T 630 190 T 712 180" 
          fill="none" stroke="#F2EDE9" stroke-width="1.8" stroke-opacity="0.8" />

    <!-- Playhead scrubber line -->
    <line x1="380" y1="20" x2="380" y2="300" stroke="#FF3B47" stroke-width="2" />
    <polygon points="374,18 386,18 380,28" fill="#FF3B47" />
    <rect x="335" y="32" width="90" height="20" rx="2" fill="#0A0808" stroke="#C81E3A" stroke-width="1" />
    <text x="380" y="46" fill="#FF3B47" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">02:44 / 08:12</text>
  </g>

  <!-- Player Controls Bottom Bar -->
  <rect x="56" y="468" width="760" height="60" fill="#161110" />
  <circle cx="100" cy="498" r="16" fill="#C81E3A" />
  <polygon points="96,491 108,498 96,505" fill="#F2EDE9" />
  <text x="135" y="503" fill="#F2EDE9" font-family="sans-serif" font-size="13" font-weight="500">Master Track: Binaural Phase Matrix (Delta 4.5Hz)</text>
  <text x="730" y="503" fill="#9C9490" font-family="monospace" font-size="11" text-anchor="end">HRTF Filter: ACTIVE</text>

  <!-- Right Panel: Stripe Architecture & Checkout Telemetry -->
  <rect x="840" y="108" width="384" height="420" rx="2" fill="#120E0D" stroke="#251C1B" stroke-width="1" />

  <!-- Stripe Checkout Card Header -->
  <rect x="840" y="108" width="384" height="48" fill="#181312" />
  <line x1="840" y1="156" x2="1224" y2="156" stroke="#251C1B" stroke-width="1" />
  <text x="864" y="138" fill="#F2EDE9" font-family="sans-serif" font-size="14" font-weight="bold">Stripe Webhook Gateway</text>
  <circle cx="1196" cy="132" r="4" fill="#00E676" />

  <!-- Checkout Verification Specs -->
  <g transform="translate(864, 180)">
    <rect x="0" y="0" width="336" height="64" rx="2" fill="#0A0808" stroke="#281F1D" stroke-width="1" />
    <text x="16" y="24" fill="#9C9490" font-family="monospace" font-size="10">EVENT IDENTIFIER</text>
    <text x="16" y="46" fill="#F2EDE9" font-family="monospace" font-size="12" font-weight="bold">checkout.session.completed</text>

    <!-- Verification 2 -->
    <rect x="0" y="78" width="336" height="64" rx="2" fill="#0A0808" stroke="#281F1D" stroke-width="1" />
    <text x="16" y="102" fill="#9C9490" font-family="monospace" font-size="10">SECURITY PAYLOAD</text>
    <text x="16" y="124" fill="#FF3B47" font-family="monospace" font-size="12" font-weight="bold">HMAC-SHA256 Signed Secret</text>

    <!-- Verification 3 -->
    <rect x="0" y="156" width="336" height="64" rx="2" fill="#0A0808" stroke="#281F1D" stroke-width="1" />
    <text x="16" y="180" fill="#9C9490" font-family="monospace" font-size="10">DELIVERY MECHANISM</text>
    <text x="16" y="202" fill="#F2EDE9" font-family="monospace" font-size="12" font-weight="bold">Ephemeral Signed URL (Expires 15m)</text>

    <!-- Metrics row -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="102" height="60" rx="2" fill="#161110" stroke="#C81E3A" stroke-width="1" stroke-opacity="0.4" />
      <text x="51" y="24" fill="#9C9490" font-family="sans-serif" font-size="10" text-anchor="middle">LATENCY</text>
      <text x="51" y="48" fill="#F2EDE9" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold">24ms</text>

      <rect x="117" y="0" width="102" height="60" rx="2" fill="#161110" stroke="#C81E3A" stroke-width="1" stroke-opacity="0.4" />
      <text x="168" y="24" fill="#9C9490" font-family="sans-serif" font-size="10" text-anchor="middle">STEPS</text>
      <text x="168" y="48" fill="#FF3B47" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold">&lt; 2 Clics</text>

      <rect x="234" y="0" width="102" height="60" rx="2" fill="#161110" stroke="#C81E3A" stroke-width="1" stroke-opacity="0.4" />
      <text x="285" y="24" fill="#9C9490" font-family="sans-serif" font-size="10" text-anchor="middle">TYPING</text>
      <text x="285" y="48" fill="#00E676" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold">100%</text>
    </g>
  </g>

  <!-- Bottom Architecture Ribbon -->
  <rect x="56" y="552" width="1168" height="116" rx="2" fill="#14100F" stroke="#251C1B" stroke-width="1" />
  
  <g transform="translate(80, 574)">
    <text x="0" y="16" fill="#9C9490" font-family="monospace" font-size="11" font-weight="600">ENGINEERING HIGHLIGHTS</text>
    <text x="0" y="42" fill="#F2EDE9" font-family="sans-serif" font-size="14">
      Arquitectura serverless en Next.js con descarga instantánea protegida y andamiaje asistido por Antigravity AI.
    </text>
    
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="130" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="65" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">Next.js App Router</text>

      <rect x="142" y="0" width="120" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="202" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">Stripe Checkout</text>

      <rect x="274" y="0" width="110" height="22" rx="2" fill="#1E1716" stroke="#3D2B29" stroke-width="1" />
      <text x="329" y="15" fill="#9C9490" font-family="monospace" font-size="10" text-anchor="middle">TypeScript</text>

      <rect x="396" y="0" width="140" height="22" rx="2" fill="#1E1716" stroke="#C81E3A" stroke-width="1" />
      <text x="466" y="15" fill="#FF3B47" font-family="monospace" font-size="10" text-anchor="middle">Antigravity Coding</text>
    </g>
  </g>
</svg>
